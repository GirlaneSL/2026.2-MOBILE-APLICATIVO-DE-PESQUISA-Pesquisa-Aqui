<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Máscara circular para cortar a base das barras perfeitamente -->
    <clipPath id="circle-clip">
      <circle cx="100" cy="85" r="50" />
    </clipPath>
  </defs>

  <!-- Forma externa do marcador de mapa com um furo circular no centro -->
  <path d="M 100 10 
           C 58.5 10 25 43.5 25 85 
           C 25 130 75 175 100 195 
           C 125 175 175 130 175 85 
           C 175 43.5 141.5 10 100 10 Z 
           M 100 30 
           A 55 55 0 1 0 100 140 
           A 55 55 0 1 0 100 30 Z" 
        fill="#447762" 
        fill-rule="evenodd" />

  <!-- Gráfico de barras interno -->
  <g clip-path="url(#circle-clip)">
    <!-- Barra Esquerda (Azul) -->
    <rect x="64" y="90" width="18" height="60" rx="7" fill="#447762" />
    
    <!-- Barra Central (Cinza) -->
    <rect x="91" y="70" width="18" height="85" rx="7" fill="#6B7785" />
    
    <!-- Barra Direita (Cinza) -->
    <rect x="118" y="50" width="18" height="100" rx="7" fill="#6B7785" />
  </g>
</svg>
